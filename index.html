<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>sergeibogdanov</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;utf8,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <rect width='100' height='100' rx='20' fill='black'/>
      <text x='50%' y='58%' font-size='50' font-family='Arial' fill='white' text-anchor='middle'>SB</text>
    </svg>"
  />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.4s ease forwards;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      margin-bottom: 25px;
      text-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    .contact-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 18px 30px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      transition: 0.3s;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .contact-box:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-3px);
    }

    .copied {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 12px;
      font-size: 0.85em;
      animation: popFade 1.2s ease forwards;
    }

    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(0.9); }
      30% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      100% { opacity: 0; transform: translate(-50%, -8px) scale(0.95); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      color: #777;
      font-size: 0.9em;
    }

    /* SUPPORT BUTTON */
    #supportBtn {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      transition: 0.3s;
      z-index: 50;
    }

    #supportBtn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-3px);
    }

    /* MODAL */
    #modalBg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #modal {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      animation: fadeModal 0.3s ease;
    }

    @keyframes fadeModal {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    input, textarea {
      width: 90%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.25);
      color: #fff;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 14px 22px;
      border-radius: 14px;
      opacity: 0;
      animation: toastShow 0.5s forwards, toastHide 0.5s 2.2s forwards;
      z-index: 10000;
    }

    @keyframes toastShow { to { opacity: 1; } }
    @keyframes toastHide { to { opacity: 0; } }

    /* SNOW */
    .snowflake {
      position: fixed;
      top: -50px;
      color: white;
      pointer-events: none;
      animation: fallSnow linear;
    }

    @keyframes fallSnow {
      to { transform: translateY(110vh) rotate(360deg); }
    }
  </style>
</head>

<body>

  <h1>Sergei Bogdanov</h1>

  <div class="contact-box" id="copyEmail">
    📧 <span>sergei.bogdanov@sedu.fi</span>
  </div>

  <footer>Copyright © 2026</footer>

  <div id="supportBtn">💬 Tuki</div>

  <!-- Support Modal -->
  <div id="modalBg">
    <div id="modal">
      <h3>Ota yhteyttä</h3>
      <form id="contactForm">
        <input type="hidden" name="access_key" value="c5c74848-9838-42e3-a7c8-e58af4c17adc">
        <input name="name" placeholder="Nimesi" required>
        <input name="email" type="email" placeholder="Sähköpostisi" required>
        <textarea name="message" rows="4" placeholder="Viestisi..." required></textarea>
        <button type="submit">Lähetä</button>
      </form>
    </div>
  </div>

  <script>
    // COPY EMAIL
    const emailBox = document.getElementById("copyEmail");
    emailBox.onclick = () => {
      navigator.clipboard.writeText("sergei.bogdanov@sedu.fi");
      const pop = document.createElement("div");
      pop.className = "copied";
      pop.innerText = "Copied!";
      emailBox.appendChild(pop);
      setTimeout(() => pop.remove(), 1200);
    };

    // SUPPORT MODAL
    supportBtn.onclick = () => modalBg.style.display = "flex";
    modalBg.onclick = e => { if (e.target === modalBg) modalBg.style.display = "none"; };

    // FORM
    contactForm.onsubmit = async e => {
      e.preventDefault();
      const res = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: new FormData(contactForm)
      });
      modalBg.style.display = "none";
      showToast(res.ok ? "Kiitos! Viesti lähetetty." : "Virhe!");
      contactForm.reset();
    };

    function showToast(text) {
      const t = document.createElement("div");
      t.className = "toast";
      t.innerText = text;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    // SNOW
    const shapes = ['❄','❅','❆'];
    setInterval(() => {
      const s = document.createElement("div");
      s.className = "snowflake";
      s.innerText = shapes[Math.random()*3|0];
      s.style.left = Math.random()*innerWidth+"px";
      s.style.fontSize = 12+Math.random()*18+"px";
      s.style.animationDuration = 5+Math.random()*5+"s";
      document.body.appendChild(s);
      setTimeout(()=>s.remove(),10000);
    },150);
  </script>

</body>
</html>
