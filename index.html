<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>sergeibogdanov</title>

  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml;utf8,
    <svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'>
      <rect width='100' height='100' rx='20' fill='black'/>
      <text x='50%' y='58%' font-size='50' font-family='Arial' fill='white' text-anchor='middle'>SB</text>
    </svg>"
  />

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      opacity: 0;
      animation: fadeIn 1.4s ease forwards;
      overflow: hidden;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    h1 {
      font-size: 2.5em;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 25px;
      text-shadow: 0 0 12px rgba(255,255,255,0.2);
    }

    .contact-box {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.15);
      padding: 18px 30px;
      border-radius: 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 30px rgba(0,0,0,0.45);
      transition: 0.3s;
      cursor: pointer;
      position: relative;
      user-select: none;
    }

    .contact-box:hover {
      background: rgba(255,255,255,0.14);
      transform: translateY(-3px);
    }

    .contact-box span {
      font-weight: 600;
    }

    .copied {
      position: absolute;
      top: -35px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(255,255,255,0.15);
      padding: 6px 14px;
      border-radius: 12px;
      backdrop-filter: blur(8px);
      font-size: 0.85em;
      animation: popFade 1.2s ease forwards;
    }

    @keyframes popFade {
      0% { opacity: 0; transform: translate(-50%, 8px) scale(0.9); }
      30% { opacity: 1; transform: translate(-50%, 0) scale(1); }
      90% { opacity: 1; }
      100% { opacity: 0; transform: translate(-50%, -8px) scale(0.95); }
    }

    footer {
      position: absolute;
      bottom: 20px;
      color: #777;
      font-size: 0.9em;
    }

    /* SUPPORT BUTTON */
    #supportBtn {
      position: fixed;
      right: 25px;
      bottom: 25px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95em;
      transition: 0.3s;
      z-index: 50;
    }

    #supportBtn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-3px);
    }

    /* CALENDAR BUTTON */
    #calendarBtn {
      position: fixed;
      left: 25px;
      bottom: 25px;
      background: rgba(255,255,255,0.12);
      border: 1px solid rgba(255,255,255,0.18);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-size: 0.95em;
      transition: 0.3s;
      z-index: 50;
    }

    #calendarBtn:hover {
      background: rgba(255,255,255,0.18);
      transform: translateY(-3px);
    }

    /* MODALS */
    #modalBg,
    #calendarBg,
    #imgBg {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      z-index: 999;
    }

    #modal,
    #calendarModal {
      background: rgba(255,255,255,0.1);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 25px;
      border-radius: 20px;
      width: 320px;
      animation: fadeModal 0.3s ease;
    }

    @keyframes fadeModal {
      from { opacity: 0; transform: scale(0.92); }
      to { opacity: 1; transform: scale(1); }
    }

    #imgPopup {
      max-width: 90%;
      max-height: 90%;
      border-radius: 20px;
    }

    /* FORM */
    input, textarea {
      width: 90%;
      margin-top: 10px;
      padding: 10px;
      border-radius: 10px;
      border: none;
      outline: none;
      background: rgba(255,255,255,0.15);
      color: #fff;
    }

    button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.25);
      color: #fff;
      cursor: pointer;
    }

    /* TOAST */
    .toast {
      position: fixed;
      bottom: 30px;
      right: 30px;
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(12px);
      color: #fff;
      padding: 14px 22px;
      border-radius: 14px;
      font-size: 0.95em;
      opacity: 0;
      transform: translateY(15px);
      animation: toastShow 0.5s forwards, toastHide 0.5s 2.2s forwards;
      z-index: 10000;
    }

    @keyframes toastShow {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes toastHide {
      to { opacity: 0; transform: translateY(15px); }
    }

    /* CALENDAR GRID */
    #calendarGrid {
      margin-top: 15px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .dayBtn {
      background: rgba(255,255,255,0.15);
      border: 1px solid rgba(255,255,255,0.25);
      padding: 12px 0;
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: 0.3s;
      text-align: center;
    }

    .dayBtn.locked {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .dayBtn:hover:not(.locked) {
      background: rgba(255,255,255,0.25);
    }
  </style>
</head>
<script>
  const snowShapes = [
    '❄', '❅', '❆' // Unicode снежинки
  ];

  function createSnowflake() {
    const snow = document.createElement("div");
    snow.classList.add("snowflake");

    // Случайная снежинка
    snow.innerText = snowShapes[Math.floor(Math.random() * snowShapes.length)];

    // Позиция по X
    snow.style.left = Math.random() * window.innerWidth + "px";

    // Размер
    const size = 12 + Math.random() * 18;
    snow.style.fontSize = size + "px";

    // Продолжительность падения
    snow.style.animationDuration = 5 + Math.random() * 5 + "s";

    // Прозрачность
    snow.style.opacity = 0.6 + Math.random() * 0.4;

    document.body.appendChild(snow);

    setTimeout(() => snow.remove(), 10000);
  }

  setInterval(createSnowflake, 150);
</script>

<style>
  .snowflake {
    position: fixed;
    top: -50px;
    color: white;
    pointer-events: none;
    animation-name: fallSnow;
    animation-timing-function: linear;
  }

  @keyframes fallSnow {
    0% { transform: translateY(0) rotate(0deg); }
    100% { transform: translateY(110vh) rotate(360deg); }
  }
</style>
<body>

  <h1>Sergei Bogdanov</h1>

  <div class="contact-box" id="copyEmail">
    📧 <span>sergei.bogdanov@sedu.fi</span>
  </div>

  <footer>Copyright © 2025</footer>

  <div id="supportBtn">💬 Tuki</div>
  <div id="calendarBtn">🎄 Joulukalenteri</div>

  <!-- Support Modal -->
  <div id="modalBg">
    <div id="modal">
      <h3>Ota yhteyttä</h3>
      <form id="contactForm">
        <input type="hidden" name="access_key" value="c5c74848-9838-42e3-a7c8-e58af4c17adc">
        <input name="name" type="text" placeholder="Nimesi" required>
        <input name="email" type="email" placeholder="Sähköpostisi" required>
        <textarea name="message" placeholder="Viestisi..." rows="4" required></textarea>
        <button type="submit">Lähetä</button>
      </form>
    </div>
  </div>

  <!-- Calendar Modal -->
  <div id="calendarBg">
    <div id="calendarModal">
      <h3>Joulukalenteri 🎅</h3>
      <div id="calendarGrid"></div>
    </div>
  </div>

  <!-- Image popup -->
  <div id="imgBg">
    <img id="imgPopup" src="">
  </div>

  <script>
    const box = document.getElementById("copyEmail");
    const email = "sergei.bogdanov@sedu.fi";

    box.addEventListener("click", () => {
      navigator.clipboard.writeText(email);
      const pop = document.createElement("div");
      pop.className = "copied";
      pop.innerText = "Copied!";
      box.appendChild(pop);
      setTimeout(() => pop.remove(), 1200);
    });

    // SUPPORT MODAL
    document.getElementById("supportBtn").onclick = () =>
      document.getElementById("modalBg").style.display = "flex";

    document.getElementById("modalBg").onclick = e => {
      if (e.target.id === "modalBg")
        e.target.style.display = "none";
    };

    // TOAST
    function showToast(text) {
      const t = document.createElement("div");
      t.className = "toast";
      t.innerText = text;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2800);
    }

    // SEND FORM
    document.getElementById("contactForm").addEventListener("submit", async function (e) {
      e.preventDefault();
      const formData = new FormData(this);

      const resp = await fetch("https://api.web3forms.com/submit", {
        method: "POST",
        body: formData
      });

      if (resp.ok) {
        document.getElementById("modalBg").style.display = "none";
        showToast("Kiitos! Viesti lähetetty.");
        this.reset();
      } else {
        showToast("Virhe! Yritä uudelleen.");
      }
    });

    /* ===== Joulukalenteri ===== */

    document.getElementById("calendarBtn").onclick = () =>
      document.getElementById("calendarBg").style.display = "flex";

    document.getElementById("calendarBg").onclick = e => {
      if (e.target.id === "calendarBg")
        e.target.style.display = "none";
    };

    // IMAGE POPUP FUNCTION
    function openImage(src) {
      const bg = document.getElementById("imgBg");
      const img = document.getElementById("imgPopup");
      img.src = src;
      bg.style.display = "flex";

      bg.onclick = e => {
        if (e.target.id === "imgBg") bg.style.display = "none";
      };
    }

    // IMAGES FOR EACH DAY (EDIT PATHS)
    const images = {
      1: "images/day1.jpg",
      2: "images/day2.jpg",
      3: "images/day3.jpg",
      4: "images/day4.jpg",
      5: "images/day5.jpg",
      6: "images/day6.jpg",
      7: "images/day7.jpg",
      8: "images/day8.jpg",
      9: "images/day9.jpg",
      10: "images/day10.jpg",
      11: "images/day11.jpg",
      12: "images/day12.jpg",
      13: "images/day13.jpg",
      14: "images/day14.jpg",
      15: "images/day15.jpg",
      16: "images/day16.jpg",
      17: "images/day17.jpg",
      18: "images/day18.jpg",
      19: "images/day19.jpg",
      20: "images/day20.jpg",
      21: "images/day21.jpg",
      22: "images/day22.jpg",
      23: "images/day23.jpg",
      24: "images/day24.jpg",
    };

    const grid = document.getElementById("calendarGrid");
    const today = new Date();
    const currentDay = today.getMonth() === 11 ? today.getDate() : 0; 

    for (let i = 1; i <= 24; i++) {
      const btn = document.createElement("div");
      btn.className = "dayBtn";

      if (i > currentDay) btn.classList.add("locked");

      btn.innerText = i;

      btn.onclick = () => {
        if (btn.classList.contains("locked")) return;
        openImage(images[i]);
      };

      grid.appendChild(btn);
    }
  </script>

</body>
</html>
